name: TypeScript build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:connections

  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VITE_USE_MOCK_DATA: 'true'
      VITE_USE_LOCAL_CONTENT: 'false'
      VITE_DATABASE_URL: ''
      VITE_API_BASE_URL: ''
      API_PROXY_TARGET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Install browser tooling only in this isolated CI job; no lockfile changes.
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4180 > /tmp/babuni-preview.log 2>&1 &
          echo $! > /tmp/babuni-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/babuni-preview.log
          exit 1
      - run: npm run test:browser
      - name: Start isolated Morkahja content fixture server
        run: |
          mkdir -p "$RUNNER_TEMP/morkahja-fixture/game" "$RUNNER_TEMP/morkahja-fixture/UI"
          cp tests/fixtures/legacy/*.json "$RUNNER_TEMP/morkahja-fixture/game/"
          mkdir -p "$RUNNER_TEMP/morkahja-fixture/game/solutionimages"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/babunidev/Morkahja/239cf21ed759cf12137e68ae41a85a0a26382fb9/client/public/game/solutionimages/skill_aevis_levitation.webp \
            --output "$RUNNER_TEMP/morkahja-fixture/game/solutionimages/legacy_sample.webp"

          MORKAHJA_PUBLIC="$RUNNER_TEMP/morkahja-fixture" \
          VITE_USE_LOCAL_CONTENT=true LOCAL_CONTENT_WRITES=true \
          BABUNI_TEST_PROFILE_FILE="$RUNNER_TEMP/content-fixture-profiles.json" \
          BABUNI_LEGACY_CONTENT_FIXTURE_WRITES=true \
          VITE_USE_MOCK_DATA=true DATABASE_URL='' \
          npm run dev -- --host 127.0.0.1 --port 5182 > /tmp/babuni-fixture.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5182/local-content-api/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/babuni-fixture.log
          exit 1
      - name: Test rendered Morkahja content editors
        env:
          BROWSER_TEST_BASE_URL: http://127.0.0.1:5182
        run: npm run test:browser:content

  browser-connections:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VITE_USE_MOCK_DATA: 'true'
      VITE_USE_LOCAL_CONTENT: 'false'
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local service and browser
        run: |
          mkdir -p "$RUNNER_TEMP/connection-fixture/game"
          cp tests/fixtures/legacy/*.json "$RUNNER_TEMP/connection-fixture/game/"
          echo "BABUNI_BROWSER_TEST_GAME_ROOT=$RUNNER_TEMP/connection-fixture" >> "$GITHUB_ENV"
          BABUNI_TEST_PROFILE_FILE="$RUNNER_TEMP/profiles.json" \
          npm run dev -- --port 5185 > "$RUNNER_TEMP/connection-browser.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5185/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/connection-browser.log"
          exit 1
      - name: Test rendered Connections workflow and session guard
        env:
          BROWSER_TEST_BASE_URL: http://127.0.0.1:5185
        run: npm run test:browser:connections

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit all locked dependencies
        run: npm audit --json > "$RUNNER_TEMP/npm-audit-all.json" || test $? -eq 1
      - name: Audit production dependencies
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-prod.json" || test $? -eq 1
      - name: Summarize advisories and suggested fixes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          for (const [scope, path] of [
            ['all', process.env.RUNNER_TEMP + '/npm-audit-all.json'],
            ['production', process.env.RUNNER_TEMP + '/npm-audit-prod.json'],
          ]) {
            const audit = JSON.parse(readFileSync(path, 'utf8'))
            console.log('AUDIT_SCOPE', scope, 'COUNTS', JSON.stringify(audit.metadata?.vulnerabilities ?? {}))
            for (const [name, entry] of Object.entries(audit.vulnerabilities ?? {}).sort((a,b) => a[0].localeCompare(b[0]))) {
              console.log('AUDIT_PACKAGE', JSON.stringify({
                scope, name, severity: entry.severity, isDirect: entry.isDirect,
                range: entry.range, via: entry.via.map(v => typeof v === 'string'
                  ? v : { title: v.title, url: v.url, range: v.range, severity: v.severity, name: v.name }),
                effects: entry.effects, fixAvailable: entry.fixAvailable,
              }))
            }
            if (audit.error) {
              console.error('AUDIT_ERROR', scope, JSON.stringify(audit.error))
              process.exitCode = 1
            }
          }
          NODE

  postgres-fixtures:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_USER: fixture
          POSTGRES_DB: babuni_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d babuni_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fixture:fixture-only@127.0.0.1:5432/babuni_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
